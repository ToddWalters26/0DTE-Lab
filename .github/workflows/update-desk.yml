name: Update 0DTE Desk

on:
  workflow_dispatch:
  schedule:
    # UTC times — EDT (UTC-4): 9:50 ET=13:50, 10:05 ET=14:05, 3:45 PM ET=19:45
    - cron: "50 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    - cron: "45 19 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: |
          python3 build_desk.py
          mkdir -p site
          cp index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

